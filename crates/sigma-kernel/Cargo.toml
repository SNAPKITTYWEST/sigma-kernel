[package]
name = "sigma-kernel-lib"
version = "0.1.0"
edition = "2021"
description = "Sigma Kernel: Multiplicity Theory admissibility gate with four-stage verification pipeline"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "sigma_kernel_lib"
path = "src/lib.rs"

[[bin]]
name = "sigma_kernel"
path = "src/main.rs"
